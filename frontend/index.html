<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale =1.0" />
  <title>Survey form</title>
  <link rel="icon" type ="image/png" href="./images/survey Icon.png">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- title section -->
  <section id="title-section">
    <h1>Boost Your Web Development Knowledge!</h1>
    <p>Register here If you accept!</p>
  </section>
  <!-- form section  -->
  <section>
    <form id="survey-form">
      <!-- Name  -->
      <label for="name" id="name-label">Name</label>
      <input type="text" id="name" required placeholder="Enter your name"  required/>
      <!-- Email  -->
      <label for="email" id="email-label">Email </label>
      <input id="email" type="email" required placeholder="Enter your Email"  required/>
      <!-- Age -->
      <label for="number" id="number-label">Age(optional)</label>
      <input id="age" name="age" type="number" required min="10" max="65" Placeholder="Age"  required/>
      <!-- dropdown -->
      <label id="career-label" for="dropdown">Are you a student or a worker?</label>
      <select id="employ" name="employ" required>
        <option value="">----</option>
        <option value="Student">Student</option>
        <option value="Worker">Worker</option>
      </select>
      <!-- radio  -->
      <label id="radio-label">Would you like web development? </label>
      <label for="definitly" class="definitly"><input value="definitly" type="radio" id="definitly" name="likeWeb"/> Definitly 
      </label> <!-- to be reqired to select one of them (radio input) put the required attribute in one of the radio input. -->
      <label for="maybe" class="maybe"><input value="maybe" type="radio" name="likeWeb" id="maybe" /> Maybe </label>
      <label for="never" class="never"><input value="never" type="radio" name="likeWeb" id="never" /> Never </label>
      <div id="errMsgWeb"></div>
      <!-- checkbox for selecting web Development tools -->
      <label id="checkbox-label">Mark your desire tool/s from the following to learn? </label>
      <label class="ckeck-tool" for="chk1" class="chk1"><input value="HTML" id="chk1" type="checkbox" name="tools" />HTML</label>
      <label class="ckeck-tool" for="chk2"><input value="CSS" id="chk2" type="checkbox" name="tools" />CSS</label>
      <label class="ckeck-tool" for="chk3"> <input value="Javascript" id="chk3" type="checkbox" name="tools" />Javascript</label>
      <label class="ckeck-tool" for="chk4"><input value="Bootstrap" id="chk4" type="checkbox" name="tools" />Bootstrap</label>
      <label class="ckeck-tool" for="chk5"><input value="SASS" id="chk5" type="checkbox" name="tools" />SASS</label>
      <label class="ckeck-tool" for="chk6"><input value="jQuery" id="chk6" type="checkbox" name="tools" />jQuery</label>
      <label class="ckeck-tool" for="chk7"> <input value="ReactJs" id="chk7" type="checkbox" name="tools" />ReactJs</label>
      <label class="ckeck-tool" for="chk8"> <input value="Redux" id="chk8" type="checkbox" name="tools" />Redux</label>
      <label class="ckeck-tool" for="chk9"> <input value="NodeJs" id="chk9" type="checkbox" name="tools" />NodeJs</label>
      <label class="ckeck-tool" for="chk10"> <input value="ExpressJs" id="chk10" type="checkbox" name="tools" />ExpressJs</label>
      <label class="ckeck-tool" for="chk11"><input value="PostgreSQL" id="chk11" type="checkbox" name="tools" />PostgreSQL</label>
      <label class="ckeck-tool" for="chk12" class="chk11"><input value="MongoDB" type="checkbox" id="chk12"name="tools" />MongoDB</label>
      <label class="ckeck-tool" for="chk13" class="chk13"><input value="MySQL" type="checkbox" id="chk13" name="tools" />MySQL</label>
      <label class="ckeck-tool" for="chk14" class="chk14"><input value="Git" type="checkbox" id="chk14" name="tools" />Git</label>
      <label class="ckeck-tool" for="chk15" class="chk15"><input value="GitHub" type="checkbox" id="chk15" name="tools" />GitHub</label>
          <div id="toolsNotselected"></div>
      <!-- textarea for further message -->
      <label for="textarea" id="textarea-label">Any comments or suggestions? </label>
      <textarea id="comment" name="comment" placeholder="Enter your comment here..." required></textarea>
      <input id="submit" type="submit" value="Submit" />
      <div id="spinner" class="spinner"></div>
      <div id="dataCheck"></div>
    </form>
  </section>

  <script src="script.js"></script>
</body>

</html>
